services:
  postgres:
    image: postgres:16-alpine
    container_name: efootball-postgres
    environment:
      POSTGRES_USER: efootball
      POSTGRES_PASSWORD: efootball
      POSTGRES_DB: efootball
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efootball -d efootball"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: efootball-api
    environment:
      DATABASE_URL: postgresql+psycopg://efootball:efootball@postgres:5432/efootball
      CORS_ORIGINS: http://localhost:5173
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: efootball-web
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
